apiVersion: v1
kind: Pod
metadata:
  name: mi-app-galvez
  namespace: k8s-galvez
  labels:
    app: mi-app
spec:
  containers:
  - name: mi-app-contenedor
    image: miapp:galvez-1.0
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    readinessProbe:
      httpGet:
        path: /ruta_inexistente
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
